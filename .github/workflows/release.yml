name: Release InkspirePanel.exe

# Builds the single-file, self-contained InkspirePanel.exe, runs the tests, and attaches the exe + a SHA-256
# file to the GitHub release for v* tags. A manual run uploads them as workflow artifacts instead.
# The version baked into the exe (panel status bar) comes from the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and publish win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $version = "0.0.0-$($env:GITHUB_SHA.Substring(0, 7))" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building version $version"

      - name: Test
        run: dotnet test tests/InkspirePanel.Tests/InkspirePanel.Tests.csproj -c Release --nologo

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish inkspire-installer.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o dist
          Get-ChildItem dist

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/InkspirePanel.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  InkspirePanel.exe" | Set-Content dist/InkspirePanel.exe.sha256 -Encoding ascii
          Get-Content dist/InkspirePanel.exe.sha256

      - name: Publish release assets
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Inkspire Panel ${{ github.ref_name }}
          files: |
            dist/InkspirePanel.exe
            dist/InkspirePanel.exe.sha256

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: InkspirePanel-${{ steps.ver.outputs.version }}
          path: |
            dist/InkspirePanel.exe
            dist/InkspirePanel.exe.sha256
          if-no-files-found: error
